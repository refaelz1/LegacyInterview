services:
  - type: web
    name: legacy-code-challenge
    runtime: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y git
      pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: GRADIO_SERVER_NAME
        value: "0.0.0.0"
    autoDeploy: true
